      label: Question
      type: string
    - name: a
      label: Answer
      type: text
    list: true
  - name: related
    label: Related services
    type: select
    options:
      values:
      - accounting-bookkeeping
      - accounting-system-setup
      - accounts-catch-up
      - audit-readiness
      - audit-support
      - automation-retainer
      - books-cleanup
      - cash-flow-forecasting
      - consolidation-group-reporting
      - controls-sop-review
      - cost-pricing-analysis
      - dashboard-reporting-build
      - due-diligence-support
      - finance-automation
      - financial-modelling
      - financial-reporting
      - financial-statements-ifrs
      - fpa-cfo-advisory
      - fraud-anomaly-review
      - gst-india
      - internal-audit
      - mis-dashboards
      - payroll
      - payroll-india
      - payroll-saudi-wps-gosi
      - payroll-uae-wps
      - saudi-vat-zatca-e-invoicing
      - taxation
