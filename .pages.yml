# Editing-screen layout for Pages CMS (app.pagescms.org). Regenerate with: python3 tools/make-cms-config.py
media:
  input: static/assets/uploads
  output: /assets/uploads
content:
- name: services
  label: Services
  type: collection
  path: content/services
  format: json
  fields:
  - name: title
    label: Page heading (H1)
    type: string
    required: true
  - name: navLabel
    label: Short name used in menus and links
    type: string
  - name: parent
    label: Belongs to (leave blank for a main service)
    type: select
    options:
      values:
      - ''
      - accounting-bookkeeping
      - audit-support
      - finance-automation
      - financial-reporting
      - fpa-cfo-advisory
      - payroll
      - taxation
  - name: order
    label: Order in lists (1 = first)
    type: number
  - name: icon
    label: Icon
    type: select
    options:
      values: &id002
      - book
      - calendar
      - chart
      - shield
      - message
      - receipt
      - percent
      - users
      - file
      - trend
      - search
      - layers
      - globe
      - link
      - sliders
      - clock
      - bank
      - wallet
      - zap
      - gear
      - lock
      - check
      - target
      - mail
      - rocket
      - building
      - store
      - trendup
      - handshake
  - name: markets
    label: Markets
    type: select
    options:
      values:
      - india
      - uae
      - saudi-arabia
    list: true
  - name: kind
    label: How it is delivered
    type: select
    options:
      values:
      - subscription
      - project
      - both
  - name: summary
    label: Short summary (used on cards)
    type: text
  - name: metaTitle
    label: Search title (under about 60 characters)
    type: string
  - name: metaDescription
    label: Search description (140 to 160 characters)
    type: text
  - name: heroIntro
    label: Intro text in the top banner
    type: text
  - name: overview
    label: Overview paragraphs
    type: rich-text
  - name: whatWeDo
    label: What we do (one point each)
    type: string
    list: true
  - name: whoFor
    label: Who this is for
    type: string
    list: true
  - name: byPlan
    label: How it changes by plan
    type: object
    fields:
    - name: foundation
      label: Foundation
      type: text
    - name: growth
      label: Growth
      type: text
    - name: cfo
      label: CFO
      type: text
  - name: duration
    label: Typical timeline (projects)
    type: string
  - name: note
    label: Highlighted note
    type: text
